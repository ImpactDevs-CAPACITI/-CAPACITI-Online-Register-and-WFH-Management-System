spring.datasource.url=jdbc:h2:mem:capaciti;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.application.name=capaciti-online-register-backend
server.servlet.context-path=/capaciti-online-register

# Provide a Base64-encoded secret containing at least 32 bytes.
jwt.secret= Y2FwYWNpdGl3ZmhzZWNyZXRrZXkyMDI2c3VwZXJzZWN1cmViaWdnZXJhdGxlYXN0MzJieXRlcw==
jwt.expiration-minutes=60

#Demo data seeder
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}
app.seed.campus-name=${SEED_CAMPUS_NAME:CAPACITI Cape Town}
app.seed.campus-lat=${SEED_CAMPUS_LAT:}
app.seed.campus-lon=${SEED_CAMPUS_LON:}
app.seed.campus-cidrs=${SEED_CAMPUS_CIDRS:}
