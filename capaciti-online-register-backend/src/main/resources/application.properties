server.port=8080
spring.application.name=capaciti-online-register-backend
app.timezone=Africa/Johannesburg

#Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
supabase.url=${SUPABASE_URL:}, supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}, supabase.signed-url-seconds=600

# Provide a Base64-encoded secret containing at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=480
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=9
app.quality.max-attempts=3
teams.webhook-url=${TEAMS_WEBHOOK_URL:}
teams.timeout-seconds=5



#Demo data seeder
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}
app.seed.campus-name=${SEED_CAMPUS_NAME:CAPACITI Cape Town}
app.seed.campus-lat=${SEED_CAMPUS_LAT:-33.9337219}
app.seed.campus-lon=${SEED_CAMPUS_LON:18.4604591}
app.seed.campus-cidrs=${SEED_CAMPUS_CIDRS:}
